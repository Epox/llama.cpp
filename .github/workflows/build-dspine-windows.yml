name: Build DSpine Windows CUDA

on:
  workflow_dispatch:

jobs:
  build:
    name: Windows CUDA 12.4 x64
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dspine
          submodules: recursive

      - name: Install CUDA 12.4
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: '12.4'
          cuda_arch: 'x64'

      - name: Install Ninja
        run: choco install ninja -y

      - name: Build with MSVC and CMake
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DGGML_NATIVE=OFF ^
            -DGGML_AVX512=OFF ^
            -DGGML_AVX2=ON ^
            -DLLAMA_BUILD_BORINGSSL=ON ^
            -DGGML_CUDA=ON ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DGGML_CUDA_CCCL_VERSION=v3.4.3
          cmake --build build --config Release -j 4 --target llama-server llama-cli llama-bench

      - name: Copy CUDA runtime DLLs
        shell: pwsh
        run: |
          if (-not (Test-Path "build\bin\Release")) {
            New-Item -ItemType Directory -Path "build\bin\Release" -Force
          }
          if (Test-Path "$env:CUDA_PATH\bin") {
            Copy-Item "$env:CUDA_PATH\bin\cudart64_*.dll" -Destination "build\bin\Release" -ErrorAction SilentlyContinue
            Copy-Item "$env:CUDA_PATH\bin\cublas64_*.dll" -Destination "build\bin\Release" -ErrorAction SilentlyContinue
            Copy-Item "$env:CUDA_PATH\bin\cublasLt64_*.dll" -Destination "build\bin\Release" -ErrorAction SilentlyContinue
          }

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: llama-dspine-windows-cuda12.4-x64
          path: build/bin/Release/
